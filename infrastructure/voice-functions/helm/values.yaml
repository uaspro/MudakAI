app:
  nameOverride: "voice-functions"

  replicaCount: 1

  image:
    repository: mudakai-voice-functions
    pullPolicy: Always
    tag: "latest"

  imagePullSecrets:
    - name: registry-credentials
      create: false
      dockerconfigjson: ""

  dapr:
    enabled: true
    appId: "mudakaivoice-functions"
    appPort: "80"

  service:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 80

  secret:
    enabled: true
    data:
      AzureWebJobsStorage: ""
      BlobStorage: ""
      ServiceBus: ""
      DiscordBotToken: ""

  env:
    - name: FUNCTIONS_WORKER_RUNTIME
      value: "dotnet-isolated"
    - name: AzureWebJobsScriptRoot
      value: "/home/site/wwwroot"

  envFromSecret: {}

  configMap:
    enabled: true
    mountPath: /home/site/wwwroot/appsettings.json
    subPath: appsettings.json
    data:
      appsettings.json: |
        {
          "BlobStorageAudioContainerName": "audio",
          "BlobStorageLocksContainerName": "locks"
        }

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  nodeSelector:
    kubernetes.io/arch: amd64
