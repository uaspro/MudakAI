app:
  nameOverride: "tts-functions"

  replicaCount: 1

  image:
    repository: mudakai-tts-functions
    pullPolicy: Always
    tag: "latest"

  imagePullSecrets:
    - name: registry-credentials
      create: false
      dockerconfigjson: ""

  dapr:
    enabled: true
    appId: "mudakaitexttospeech-functions"
    appPort: "80"

  service:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 80

  secret:
    enabled: true
    data:
      AzureWebJobsStorage: ""
      BlobStorage: ""
      ServiceBusListen: ""
      ServiceBusSend: ""
      OpenAIApiKey: ""

  env:
    - name: FUNCTIONS_WORKER_RUNTIME
      value: "dotnet-isolated"
    - name: AzureWebJobsScriptRoot
      value: "/home/site/wwwroot"

  envFromSecret: {}

  configMap:
    enabled: true
    mountPath: /home/site/wwwroot/appsettings.json
    subPath: appsettings.json
    data:
      appsettings.json: |
        {
          "ServiceBusPlaybackQueueName": "playback",
          "BlobStorageAudioContainerName": "audio",
          "OpenAI": {
            "TTSModelId": "gpt-4o-mini-tts"
          }
        }

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  nodeSelector:
    kubernetes.io/arch: amd64
