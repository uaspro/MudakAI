# Default values for mudakai-base-app
# This is a library chart, these values serve as defaults

replicaCount: 1

image:
  repository: ""
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

global:
  registry: "registry-docker-registry.container-registry.svc.cluster.local:5000"

serviceAccount:
  create: false
  name: ""

podAnnotations: {}
podLabels: {}

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: "traefik"
  annotations: {}
  hosts: []
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

env: []
envFromSecret: {}

configMap:
  enabled: false
  mountPath: ""
  subPath: ""
  data: {}

secret:
  enabled: false
  data: {}

persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data
  storageClass: ""

startupProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

dapr:
  enabled: false
  appId: ""
  appPort: "8080"

deploymentTimestamp: ""
